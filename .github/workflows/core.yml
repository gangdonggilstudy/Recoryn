name: Recoryn offline validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check src tests scripts packaging
      - name: Formatting
        run: python -m ruff format --check src tests scripts packaging
      - name: Types
        shell: pwsh
        run: |
          $env:MYPYPATH = 'src'
          python -m mypy src/recoryn scripts packaging
      - name: Offline core tests
        env:
          QT_QPA_PLATFORM: offscreen
          HF_HUB_OFFLINE: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python -m pytest -q -p no:cacheprovider -W error::ResourceWarning --cov=recoryn --cov-branch --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=85
      - name: Check separate line and branch budgets
        run: python scripts/check_coverage.py coverage.json
      - name: Build wheel without runtime dependencies
        run: python -m pip wheel --no-deps --wheel-dir dist .

  optional-runtime:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install pinned optional runtimes without model weights
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install '.[local-ai,packaging,diarization]'
      - name: Optional runtime contracts and release fixtures
        env:
          QT_QPA_PLATFORM: offscreen
          HF_HUB_OFFLINE: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python -m pytest -q -p no:cacheprovider -W error::ResourceWarning tests/contract tests/release tests/unit/test_diarization.py tests/integration/test_diarization_independent.py tests/integration/test_release_independent.py
      - name: Synthetic source release smoke without inference
        env:
          QT_QPA_PLATFORM: offscreen
          HF_HUB_OFFLINE: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python packaging/entry_cli.py --release-smoke
