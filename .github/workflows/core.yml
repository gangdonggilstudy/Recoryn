name: Recording core

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Types
        run: python -m mypy src/recoryn
      - name: Offline core tests
        run: python -m pytest -q --cov=recoryn --cov-branch --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=85
      - name: Check separate line and branch budgets
        run: python scripts/check_coverage.py coverage.json
      - name: Build wheel without runtime dependencies
        run: python -m pip wheel --no-deps --wheel-dir dist .
