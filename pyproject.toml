[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "recoryn"
version = "0.2.0.dev2"
description = "Local-first recording core with recoverable audio chunks"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
desktop = ["PySide6-Essentials==6.12.0", "PySide6-Addons==6.12.0"]
local-ai = [
  "faster-whisper==1.2.1", "numpy==2.3.5", "av==16.1.0",
  "ctranslate2==4.9.0", "onnxruntime==1.32.0", "huggingface-hub==2.4.0",
  "tokenizers==0.23.3",
]
packaging = ["pyinstaller==6.22.3"]
diarization = [
  "sherpa-onnx==2.0.1; python_version >= '3.12' and sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
  "onnx==1.23.2; python_version >= '3.12' and sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
  "numpy==2.3.5; python_version >= '3.12' and sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
]
dev = [
  "pytest>=8,<10",
  "hypothesis>=6,<7",
  "pytest-cov>=7,<8",
  "coverage>=7.10.6,<8",
  "ruff>=0.15,<0.16",
  "mypy>=1.19,<2",
  "numpy==2.3.5",
]

[project.scripts]
recoryn = "recoryn.cli:main"

[project.gui-scripts]
recoryn-desktop = "recoryn.ui:launch"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers --import-mode=importlib"
markers = [
  "unit: deterministic module contracts",
  "property: generated invariant checks",
  "integration: real files, SQLite, threads or subprocesses",
  "e2e: executable CLI workflows",
  "hardware: explicit physical device validation",
  "live_provider: opt-in external provider validation",
  "ui: offscreen Qt interaction without physical audio or network",
  "contract: deterministic provider and adapter fixtures",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/recoryn"]

[tool.coverage.run]
branch = true
source = ["recoryn"]
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
